<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="lib/anime.umd.min.js"></script>
    <script src="lib/p5.min.js"></script>
    <style>
      :root {
        --ground: #0b1026;
        --ink: #ffffff;
        --accent: #e40000;
        --muted: #9aa6c8;
        --font-display: "Inter";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #field {
        position: absolute;
        inset: 0;
      }
      #title {
        position: absolute;
        top: 380px;
        width: 100%;
        text-align: center;
        font-size: 120px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      #title span {
        display: inline-block;
        white-space: pre;
      }
      #bar {
        position: absolute;
        top: 560px;
        left: 510px;
        width: 900px;
        height: 8px;
        background: var(--accent);
        transform-origin: left center;
      }
      #sub {
        position: absolute;
        top: 610px;
        width: 100%;
        text-align: center;
        font-size: 56px;
        color: var(--muted);
      }
      #count {
        color: var(--ink);
        font-weight: 900;
      }
      #badge {
        position: absolute;
        left: 96px;
        bottom: 96px;
        font-size: 30px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="field" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <span>Q</span><span>A</span><span>N</span><span>T</span><span>A</span><span>S</span><span> </span><span>A</span><span>3</span><span>5</span><span>0</span>
      </h1>
      <div id="bar" class="clip" data-start="0" data-duration="6" data-track-index="2"></div>
      <div id="sub" class="clip" data-start="0" data-duration="6" data-track-index="3"><span id="count">0</span> часа без посадки</div>
      <div id="badge" class="clip" data-start="0" data-duration="6" data-track-index="4">HyperFrames: GSAP · anime.js · p5.js</div>
    </div>

    <script>
      // GSAP: the root timeline (title letters).
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#title span",
        { opacity: 0, y: 80, rotation: -12 },
        { opacity: 1, y: 0, rotation: 0, duration: 0.7, ease: "expo.out", stagger: 0.05 },
        0.2,
      );

      // anime.js v4: one paused timeline, seeked by HyperFrames through window.__hfAnime.
      // Start times go in timeline positions; a per-animation `delay` is not honoured by the seek.
      const counter = { v: 0 };
      const atl = anime.createTimeline({ autoplay: false, defaults: { ease: "outQuad" } });
      atl
        // Before a child's start anime leaves the element untouched, so pin the start state at 0.
        .set("#bar", { scaleX: 0 }, 0)
        .add("#bar", { scaleX: [0, 1], duration: 900, ease: "inOutQuad" }, 900)
        .add(
          counter,
          {
            v: [0, 22],
            duration: 1400,
            onRender: () => (document.getElementById("count").textContent = Math.round(counter.v)),
          },
          1300,
        );
      window.__hfAnime = window.__hfAnime || [];
      window.__hfAnime.push(atl);

      // p5.js: noLoop instance redrawn from the seek time only.
      let sketchTime = 0;
      const sketch = new p5((p) => {
        p.setup = () => {
          p.pixelDensity(1);
          p.createCanvas(1920, 1080);
          p.noLoop();
        };
        p.draw = () => {
          p.noiseSeed(42);
          p.randomSeed(42);
          p.background(11, 16, 38);
          p.noFill();
          for (let i = 0; i < 60; i++) {
            for (let j = 0; j < 34; j++) {
              let x = (i + 0.5) * 32 + p.random(-10, 10);
              let y = (j + 0.5) * 32 + p.random(-10, 10);
              const hot = p.random() < 0.08;
              p.stroke(hot ? p.color(228, 0, 0, 200) : p.color(154, 166, 200, 70));
              p.strokeWeight(hot ? 2.5 : 1.2);
              p.beginShape();
              for (let k = 0; k < 12; k++) {
                p.vertex(x, y);
                const a = p.noise(x * 0.0018, y * 0.0018, sketchTime * 0.35) * p.TWO_PI * 2;
                x += Math.cos(a) * 9;
                y += Math.sin(a) * 9;
              }
              p.endShape();
            }
          }
        };
      }, document.getElementById("field"));

      window.addEventListener("hf-seek", (e) => {
        sketchTime = e.detail.time;
        sketch.redraw();
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
